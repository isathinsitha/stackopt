[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stackopt"
version = "0.1.0.dev0"
description = "Local CLI for deterministic dimensional tolerance analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stackopt = "stackopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackopt", "stackopt.*"]
namespaces = false

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# CAD runtimes are only importable inside SOLIDWORKS' pywin32 or FreeCAD environments.
module = ["FreeCAD", "pythoncom", "win32com", "win32com.*"]
ignore_missing_imports = true
