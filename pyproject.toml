[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stackopt"
version = "0.1.0.dev0"
description = "Local CLI for deterministic dimensional tolerance analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stackopt = "stackopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackopt", "stackopt.*"]
namespaces = false
